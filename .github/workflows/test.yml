name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The tests run inside the app image: they need its ffmpeg, mkvmerge, dovi_tool and Python packages.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mediaman:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests
        run: >
          docker run --rm -v "$PWD":/src -w /src --entrypoint sh mediaman:ci -c
          "pip install -q pytest && python -m pytest -q -p no:cacheprovider tests"
