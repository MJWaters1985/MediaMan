name: Release

# Pushing a tag like v1.8.0 builds the image, runs every test against it, publishes it to
# ghcr.io/<owner>/mediaman and creates a GitHub release from that version's CHANGELOG.md section.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write     # create the GitHub release
  packages: write     # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(grep -m1 -o 'VERSION = "[^"]*"' app/main.py | cut -d'"' -f2)
          echo "tag $tag, app $app"
          [ "$tag" = "$app" ] || { echo "::error::Tag v$tag doesn't match VERSION $app in app/main.py"; exit 1; }
          grep -q "^## $tag " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $tag"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Build the image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mediaman:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests
        run: >
          docker run --rm -v "$PWD":/src -w /src --entrypoint sh mediaman:ci -c
          "pip install -q pytest && python -m pytest -q -p no:cacheprovider tests"

      - name: End-to-end check (chunked encodes, HDR, Dolby Vision, pause)
        run: docker run --rm -v "$PWD":/src:ro --entrypoint python mediaman:ci /src/tests/integration_chunked.py

      - name: Image names and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mediaman
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TrueNAS runs on x86-64 only, so that's the one platform published.
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "MediaMan $tag" --notes-file notes.md --verify-tag
