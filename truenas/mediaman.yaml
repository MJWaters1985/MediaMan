# MediaMan — TrueNAS custom app (Apps → Discover Apps → ⋮ → Install via YAML)
#
# Before installing:
#   1. Build the image on the NAS:  sudo sh truenas/build-on-nas.sh   (creates mediaman:latest)
#   2. Replace every /mnt/POOL/... path below with your real host paths:
#        - the same folders your Jellyfin app uses for its Movies and Shows libraries
#        - the folder qBittorrent saves FINISHED downloads to
#        - a dataset/folder for MediaMan's own config + database
#   3. Check the GPU groups: `ls -ln /dev/dri` on the NAS shows the group IDs of card0/renderD128
#      (TrueNAS is normally 44 = video, 107 = render). Keep them in group_add below.
#
# MediaMan runs as UID/GID 568 ("apps"), the same user TrueNAS runs Jellyfin and qBittorrent as,
# so files it writes are owned the way those apps expect. The user needs write access to the
# library folders (and read access to the downloads folder).
services:
  mediaman:
    image: mediaman:latest
    pull_policy: never              # image is built locally on the NAS
    container_name: mediaman
    restart: unless-stopped
    user: "568:568"
    group_add:
      - "44"                        # video
      - "107"                       # render  (needed for /dev/dri/renderD128)
    devices:
      - /dev/dri:/dev/dri           # Intel QSV / VAAPI, AMD VAAPI. Remove if the NAS has no iGPU/GPU.
    environment:
      TZ: "Etc/UTC"                 # set to your timezone so the transcode time window is local
      # Optional HTTPS: PEM full-chain cert + key, paths as seen inside the container (e.g. under a
      # mounted folder). MediaMan restarts itself onto renewed files once no transcode is running.
      # MEDIAMAN_TLS_CERT: "/certs/fullchain.pem"
      # MEDIAMAN_TLS_KEY: "/certs/privkey.pem"
    ports:
      - "8765:8765"
    volumes:
      - /mnt/POOL/apps/mediaman:/config
      - /mnt/POOL/MEDIA/Movies:/media/movies
      - /mnt/POOL/MEDIA/Shows:/media/tv
      - /mnt/POOL/DOWNLOADS/complete:/downloads
    # NVIDIA GPU instead of /dev/dri? Install the NVIDIA driver (Apps → Configuration → Settings),
    # remove `devices`/`group_add` above and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video, compute, utility]
    # and add to environment:  NVIDIA_DRIVER_CAPABILITIES: "all"
